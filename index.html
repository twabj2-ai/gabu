<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복권구입 이체 안내</title>
  <style>
    body { 
      text-align: center; 
      font-family: 'Pretendard', -apple-system, sans-serif; 
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }
    
    /* 메인 화면 영역 (버튼만 꽉 차게 중앙 정렬) */
    #main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .copy-btn { 
      background-color: #ffd700; 
      color: #000; 
      font-size: 36px; /* '복권구입' 글씨 크기 대폭 확대 */
      font-weight: 900;
      padding: 40px 20px; /* 버튼 상하 크기 확대 */
      border: none; 
      border-radius: 20px; 
      cursor: pointer; 
      width: 100%; 
      max-width: 400px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15); 
      line-height: 1.5;
    }
    .copy-btn:active {
      transform: scale(0.98); 
    }

    .btn-small-text {
      font-size: 24px; /* '계좌번호 복사하기' 글씨 크기 균형 맞춤 */
      display: block;
      margin-top: 5px;
    }

    /* 커스텀 팝업(모달) 디자인 */
    .modal-overlay {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); 
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 40px 20px 30px;
      border-radius: 20px;
      width: 80%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-text {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 30px;
      word-break: keep-all;
    }
    .highlight-red {
      color: #e50000; 
      font-weight: 900; 
    }
    .close-btn {
      background-color: #333;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border: none;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
    }
    .close-btn:active {
      background-color: #555;
    }

    /* 완료 후 나타날 종료 안내 메시지 (기본은 숨김) */
    #done-message {
      display: none;
      font-size: 20px;
      color: #888;
      font-weight: bold;
    }
  </style>
</head>
<body>
  
  <!-- 처음 스캔 시 보이는 화면 (제목 없이 버튼만) -->
  <div id="main-content">
    <button class="copy-btn" onclick="copyAccount()">
      복권구입
      <span class="btn-small-text">계좌번호 복사하기</span>
    </button>
  </div>

  <!-- 완료 후 남겨질 텍스트 (화면이 사라진 느낌을 줌) -->
  <div id="done-message">
    창을 닫고 뱅킹 앱을 실행해 주세요.
  </div>

  <!-- 커스텀 팝업창 -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-text">
        복권구입 이체 계좌가 복사되었습니다.<br><br>
        사용하시는 <span class="highlight-red">고객님의 뱅킹앱</span>을<br>열어 주세요.
      </div>
      <button class="close-btn" onclick="closeAndHide()">확인</button>
    </div>
  </div>

  <script>
    function copyAccount() {
      // 여기에 실제 사장님의 은행명과 계좌번호를 띄어쓰기 포함해 입력하세요 (예: 농협 123-4567-8901)
      const account = "케이뱅크 100-301-168768"; 
      
      navigator.clipboard.writeText(account).then(() => {
        // 복사 성공 시 팝업창 띄움
        document.getElementById('customModal').style.display = 'flex';
      }).catch(err => {
        alert("복사에 실패했습니다. 버튼을 다시 눌러주세요.");
      });
    }

    function closeAndHide() {
      // 1. 팝업창 숨기기
      document.getElementById('customModal').style.display = 'none';
      
      // 2. 메인 화면(버튼) 숨기기
      document.getElementById('main-content').style.display = 'none';
      
      // 3. 은은한 안내 문구만 띄우기
      document.getElementById('done-message').style.display = 'block';

      // 4. 창 닫기 시도
      window.close();
    }
  </script>
</body>
</html>
